<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找回密码 · 物资系统</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="auth">

  <section class="auth-brand">
    <div class="bmark">资</div>
    <h1>物资系统</h1>
    <p class="lead">两步重置密码。已绑定邮箱的用户可自助找回；未绑定邮箱请联系管理员重置。</p>
    <div class="auth-feats">
      <div class="auth-feat"><span class="ck">✓</span><span>验证码 10 分钟内有效，仅可使用一次</span></div>
      <div class="auth-feat"><span class="ck">✓</span><span>重置成功后，账号原有登录会话立即失效</span></div>
    </div>
  </section>

  <section class="auth-panel">
    <div class="auth-form">

      <!-- 第 1 步 -->
      <div id="step1">
        <h2>找回密码</h2>
        <p class="lead">输入用户名或邮箱，我们会把验证码发到你的邮箱</p>

        <div class="steps">
          <span class="step on"><span class="n">1</span>验证身份</span>
          <span class="bar"></span>
          <span class="step"><span class="n">2</span>重置密码</span>
        </div>

        <form id="fp1">
          <div class="field">
            <label for="u">用户名或邮箱<span class="req">*</span></label>
            <input class="input" id="u" placeholder="请输入用户名或注册邮箱">
          </div>
          <button class="btn primary lg block" type="submit">发送验证码</button>
        </form>

        <p class="alt"><a href="01-login.html">← 返回登录</a></p>
      </div>

      <!-- 第 2 步 -->
      <div id="step2" style="display:none">
        <h2>重置密码</h2>
        <p class="lead">验证码已发送至 <b id="mail">zhangsan@example.com</b></p>

        <div class="steps">
          <span class="step"><span class="n">✓</span>验证身份</span>
          <span class="bar"></span>
          <span class="step on"><span class="n">2</span>重置密码</span>
        </div>

        <form id="fp2">
          <div class="field">
            <label for="code">验证码<span class="req">*</span></label>
            <input class="input" id="code" maxlength="6" placeholder="6 位数字验证码" style="letter-spacing:.35em;font-weight:600">
            <div class="hint" id="cd">59 秒后可重新获取</div>
          </div>

          <div class="field">
            <label for="p1">新密码<span class="req">*</span></label>
            <input class="input" id="p1" type="password" placeholder="6~20 位，至少含字母和数字">
          </div>

          <div class="field">
            <label for="p2">确认新密码<span class="req">*</span></label>
            <input class="input" id="p2" type="password" placeholder="请再次输入新密码">
          </div>

          <button class="btn primary lg block" type="submit">重置密码并登录</button>
          <button class="btn block" type="button" style="margin-top:9px" onclick="showStep(1)">上一步</button>
        </form>
      </div>

      <!-- 未绑定邮箱 -->
      <div id="noMail" style="display:none">
        <h2>找回密码</h2>
        <p class="lead">该账号未绑定邮箱</p>
        <div class="banner warn">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" style="flex:0 0 17px"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <span>该账号未绑定邮箱，无法自助重置。请<b>联系管理员</b>，由管理员在「人员信息」中为你重置密码。</span>
        </div>
        <p class="alt"><a href="01-login.html">← 返回登录</a></p>
      </div>

    </div>
  </section>

</div>

<div class="toast-wrap"></div>

<script src="assets/app.js"></script>
<script>
  function showStep(n) {
    $ = window.$;
    $('#step1').style.display = n === 1 ? '' : 'none';
    $('#step2').style.display = n === 2 ? '' : 'none';
    $('#noMail').style.display = 'none';
  }

  document.getElementById('fp1').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = document.getElementById('u').value.trim();
    if (!u) { toast('请输入用户名或邮箱', 'err'); return; }
    if (u === 'lisi' || u === 'nomail') {          // 演示：未绑定邮箱账号
      window.$('#step1').style.display = 'none';
      window.$('#noMail').style.display = '';
      return;
    }
    window.$('#mail').textContent = u.indexOf('@') > 0 ? u : 'zhangsan@example.com';
    showStep(2);
    toast('验证码已发送，请查收邮件');
    startCount();
  });

  var timer;
  function startCount() {
    var s = 59;
    var el = document.getElementById('cd');
    clearInterval(timer);
    el.textContent = s + ' 秒后可重新获取';
    timer = setInterval(function () {
      s--;
      el.textContent = s > 0 ? s + ' 秒后可重新获取' : '重新获取验证码';
      if (s <= 0) clearInterval(timer);
    }, 1000);
  }

  document.getElementById('fp2').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = document.getElementById('code').value.trim();
    var p1 = document.getElementById('p1').value;
    var p2 = document.getElementById('p2').value;
    if (!/^\d{6}$/.test(code)) { toast('请输入 6 位数字验证码', 'err'); return; }
    if (code !== '123456') { toast('验证码错误或已过期', 'err'); return; }
    if (p1.length < 6 || p1.length > 20) { toast('密码需 6~20 位', 'err'); return; }
    if (p1 !== p2) { toast('两次输入的密码不一致', 'err'); return; }
    toast('密码重置成功');
    setTimeout(function(){ location.href = '01-login.html'; }, 900);
  });
</script>
</body>
</html>
