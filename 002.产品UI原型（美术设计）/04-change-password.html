<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>修改密码 · 物资系统</title>
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;background:var(--plane);padding:24px">
  <div style="width:100%;max-width:440px">

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      <div class="brand-mark" style="width:36px;height:36px;font-size:16px">资</div>
      <div>
        <div class="brand-name" style="font-size:15px">物资系统</div>
        <div class="brand-sub">出入库管理</div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>修改密码</h3>
        <span class="badge info" style="margin-left:auto">首次登录</span>
      </div>
      <div class="card-body">

        <div class="banner warn" style="margin-bottom:18px">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" style="flex:0 0 17px"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
          <span>你正在使用初始密码 <b class="mono">admin</b> 登录，为保障账号安全，<b>必须修改密码</b>后才能使用其他功能。</span>
        </div>

        <form id="cpForm">
          <div class="field">
            <label for="old">当前密码<span class="req">*</span></label>
            <input class="input" id="old" type="password" value="admin" placeholder="请输入当前密码">
          </div>

          <div class="field">
            <label for="p1">新密码<span class="req">*</span></label>
            <input class="input" id="p1" type="password" placeholder="6~20 位，至少含字母和数字">
            <div class="hint">不要与其他网站使用相同密码</div>
          </div>

          <div class="field">
            <label for="p2">确认新密码<span class="req">*</span></label>
            <input class="input" id="p2" type="password" placeholder="请再次输入新密码">
          </div>

          <div style="display:flex;gap:9px;margin-top:20px">
            <button class="btn primary" style="flex:1" type="submit">保存并进入系统</button>
            <a class="btn" href="01-login.html">退出登录</a>
          </div>
        </form>

      </div>
    </div>

  </div>
</div>

<div class="toast-wrap"></div>

<script src="assets/app.js"></script>
<script>
  document.getElementById('cpForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var o = document.getElementById('old').value;
    var p1 = document.getElementById('p1').value;
    var p2 = document.getElementById('p2').value;
    if (o !== 'admin') { toast('当前密码不正确', 'err'); return; }
    if (p1.length < 6 || p1.length > 20 || !(/[A-Za-z]/.test(p1) && /[0-9]/.test(p1))) {
      toast('新密码需 6~20 位且至少包含字母和数字', 'err'); return;
    }
    if (p1 === o) { toast('新密码不能与当前密码相同', 'err'); return; }
    if (p1 !== p2) { toast('两次输入的新密码不一致', 'err'); return; }
    toast('密码修改成功');
    setTimeout(function(){ location.href = '05-home-stock.html'; }, 900);
  });
</script>
</body>
</html>
